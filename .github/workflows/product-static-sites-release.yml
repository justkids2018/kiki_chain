name: Product Static Sites Release

on:
  workflow_dispatch:
    inputs:
      install_nginx:
        description: "Install or update nginx config for all.keepthinking.me (/, /hikiki/)"
        required: false
        type: boolean
        default: false
      skip_url_check:
        description: "Skip public URL checks after deploy"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PRODUCT_SOURCE_DIR: kiki_product_html
  SITE_DOMAIN: all.keepthinking.me
  SITE_URL: https://all.keepthinking.me/
  HIKIKI_URL: https://all.keepthinking.me/hikiki/
  DEFAULT_REMOTE_DIR: ~/product_site_static
  DEFAULT_TLS_CERT_DOMAIN: all.keepthinking.me

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static sites
        run: |
          set -euo pipefail
          test -f "${PRODUCT_SOURCE_DIR}/all/index.html"
          test -f "${PRODUCT_SOURCE_DIR}/all/img/app_icon.png"
          grep -q "https://all.keepthinking.me/hikiki/" "${PRODUCT_SOURCE_DIR}/all/index.html"
          test -f "${PRODUCT_SOURCE_DIR}/hikiki/index.html"
          test -f "${PRODUCT_SOURCE_DIR}/hikiki/hikik_version.json"
          echo "Product site files:"
          find "${PRODUCT_SOURCE_DIR}/all" -type f | sort
          find "${PRODUCT_SOURCE_DIR}/hikiki" -type f | sort

      - name: Validate deploy secrets
        env:
          TENCENT_SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "${TENCENT_SSH_PRIVATE_KEY}" || (echo "Missing secret: TENCENT_SSH_PRIVATE_KEY" && exit 1)
          test -n "${DEPLOY_SERVER_IP}" || (echo "Missing secret: DEPLOY_SERVER_IP" && exit 1)
          test -n "${DEPLOY_SSH_USER}" || (echo "Missing secret: DEPLOY_SSH_USER" && exit 1)

      - name: Setup SSH
        env:
          TENCENT_SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
        run: |
          set -euo pipefail
          SERVER_IP="$(echo "${DEPLOY_SERVER_IP}" | tr -d '[:space:]')"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "${TENCENT_SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${SERVER_IP}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Package static site
        run: |
          set -euo pipefail
          tar -C "${PRODUCT_SOURCE_DIR}" \
            --exclude './https' \
            --exclude './https/**' \
            --exclude './config' \
            --exclude './config/**' \
            --exclude './config_key' \
            --exclude './config_key/**' \
            --exclude './stl_config_key' \
            --exclude './stl_config_key/**' \
            -czf /tmp/product-static-site.tar.gz all hikiki
          if tar -tzf /tmp/product-static-site.tar.gz | grep -E '(^|/)(privkey|.*\.key$|.*\.crt$|.*\.pem$)' >/dev/null; then
            echo "Private key detected in static package"
            exit 1
          fi
          tar -tzf /tmp/product-static-site.tar.gz | sort

      - name: Upload and switch release
        id: deploy
        env:
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          PRODUCT_REMOTE_DIR: ${{ secrets.PRODUCT_ALL_REMOTE_DIR }}
        run: |
          set -euo pipefail
          SERVER_IP="$(echo "${DEPLOY_SERVER_IP}" | tr -d '[:space:]')"
          SSH_USER="$(echo "${DEPLOY_SSH_USER}" | tr -d '[:space:]')"
          REMOTE_DIR_INPUT="${PRODUCT_REMOTE_DIR:-}"
          REMOTE_DIR="${REMOTE_DIR_INPUT:-${DEFAULT_REMOTE_DIR}}"
          RELEASE_ID="sha-${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          REMOTE_TAR="/tmp/product-static-site-${RELEASE_ID}.tar.gz"

          scp /tmp/product-static-site.tar.gz "${SSH_USER}@${SERVER_IP}:${REMOTE_TAR}"
          ssh "${SSH_USER}@${SERVER_IP}" "bash -s" -- "${REMOTE_DIR}" "${RELEASE_ID}" "${REMOTE_TAR}" <<'REMOTE_SCRIPT' | tee /tmp/product-static-site-current-path.txt
          set -euo pipefail

          if [[ "$#" -ne 3 ]]; then
            echo "Remote script expected 3 args (REMOTE_DIR, RELEASE_ID, REMOTE_TAR), got $#" >&2
            exit 2
          fi

          REMOTE_DIR="$1"
          RELEASE_ID="$2"
          REMOTE_TAR="$3"

          case "${REMOTE_DIR}" in
            "~")
              REMOTE_DIR="${HOME}"
              ;;
            "~/"*)
              REMOTE_DIR="${HOME}/${REMOTE_DIR#~/}"
              ;;
          esac

          RELEASE_DIR="${REMOTE_DIR}/releases/${RELEASE_ID}"
          mkdir -p "${RELEASE_DIR}"
          tar -xzf "${REMOTE_TAR}" -C "${RELEASE_DIR}"
          rm -f "${REMOTE_TAR}"
          ln -sfn "${RELEASE_DIR}" "${REMOTE_DIR}/current"
          RELEASE_DIRS=()
          while IFS= read -r release_dir; do
            RELEASE_DIRS+=("${release_dir}")
          done < <(find "${REMOTE_DIR}/releases" -mindepth 1 -maxdepth 1 -type d | sort)
          if ((${#RELEASE_DIRS[@]} > 5)); then
            printf '%s\0' "${RELEASE_DIRS[@]:0:${#RELEASE_DIRS[@]}-5}" | xargs -0 rm -rf
          fi

          echo "REMOTE_DIR=${REMOTE_DIR}"
          echo "CURRENT_PATH=$(readlink -f "${REMOTE_DIR}/current")"
          REMOTE_SCRIPT

          CURRENT_PATH="$(grep '^CURRENT_PATH=' /tmp/product-static-site-current-path.txt | tail -n 1 | cut -d= -f2-)"
          REMOTE_DIR_VALUE="$(grep '^REMOTE_DIR=' /tmp/product-static-site-current-path.txt | tail -n 1 | cut -d= -f2-)"
          echo "current_path=${CURRENT_PATH}" >> "$GITHUB_OUTPUT"
          echo "remote_dir=${REMOTE_DIR_VALUE}" >> "$GITHUB_OUTPUT"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Install nginx config
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.install_nginx == 'true' }}
        env:
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          PRODUCT_ALL_TLS_CERT_DOMAIN: ${{ secrets.PRODUCT_ALL_TLS_CERT_DOMAIN }}
          CURRENT_PATH: ${{ steps.deploy.outputs.current_path }}
        run: |
          set -euo pipefail
          SERVER_IP="$(echo "${DEPLOY_SERVER_IP}" | tr -d '[:space:]')"
          SSH_USER="$(echo "${DEPLOY_SSH_USER}" | tr -d '[:space:]')"
          TLS_CERT_DOMAIN="${PRODUCT_ALL_TLS_CERT_DOMAIN:-${DEFAULT_TLS_CERT_DOMAIN}}"

          cat >/tmp/product-static-site.conf <<EOF
          server {
            listen 80;
            server_name ${SITE_DOMAIN};

            location /.well-known/acme-challenge/ {
              root /var/www/certbot;
              default_type text/plain;
            }

            location / {
              return 301 https://\$host\$request_uri;
            }
          }

          server {
            listen 443 ssl http2;
            server_name ${SITE_DOMAIN};

            ssl_certificate /etc/letsencrypt/live/${TLS_CERT_DOMAIN}/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/${TLS_CERT_DOMAIN}/privkey.pem;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_prefer_server_ciphers on;
            ssl_session_cache shared:SSL:10m;

            root ${CURRENT_PATH};
            index index.html;

            location = / {
              try_files /all/index.html =404;
            }

            location = /hikiki.html {
              return 301 /hikiki/;
            }

            location /hikiki/ {
              try_files \$uri \$uri/ /hikiki/index.html;
            }

            location / {
              try_files \$uri \$uri/ /all/index.html;
            }
          }
          EOF

          scp /tmp/product-static-site.conf "${SSH_USER}@${SERVER_IP}:/tmp/product-static-site.conf"
          ssh "${SSH_USER}@${SERVER_IP}" "sudo mkdir -p /etc/nginx/conf.d && sudo mv /tmp/product-static-site.conf /etc/nginx/conf.d/product-all.conf && sudo nginx -t && sudo systemctl reload nginx"

      - name: Verify public URLs
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.skip_url_check == 'true') }}
        run: |
          set -euo pipefail
          curl -fsSIL --retry 5 --retry-delay 3 "${SITE_URL}" | tee /tmp/product-all-url-check.txt
          curl -fsSIL --retry 5 --retry-delay 3 "${HIKIKI_URL}" | tee /tmp/hikiki-url-check.txt

      - name: Deployment summary
        if: always()
        run: |
          echo "### Product Static Site Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | Remote Dir | Current Path |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|------------|--------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${SITE_URL}\` | \`${{ steps.deploy.outputs.remote_dir }}\` | \`${{ steps.deploy.outputs.current_path }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${HIKIKI_URL}\` | \`${{ steps.deploy.outputs.remote_dir }}\` | \`${{ steps.deploy.outputs.current_path }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: \`${{ steps.deploy.outputs.release_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
