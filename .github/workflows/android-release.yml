name: Android Release Build

on:
  schedule:
    # Monday and Friday at 08:00 Asia/Shanghai (UTC+8) -> 00:00 UTC
    - cron: "0 0 * * 1,5"
  workflow_dispatch:
    inputs:
      base_version:
        description: "Base version (first 3 parts), e.g. 1.0.0 or 0.001.00"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    # Only run on main branch for scheduled builds
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}

    env:
      BASE_VERSION_DEFAULT: ${{ vars.ANDROID_BASE_VERSION || '1.0.0' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      QINIU_UPLOAD_URL: ${{ vars.QINIU_UPLOAD_URL || 'https://up-z2.qiniup.com' }}
      QINIU_UPLOAD_REGION: ${{ vars.QINIU_UPLOAD_REGION || 'z2' }}
      QINIU_DOMAIN: ${{ vars.QINIU_DOMAIN || 'img.keepthinking.me' }}
      QINIU_DOWNAPP_PREFIX: ${{ vars.QINIU_DOWNAPP_PREFIX || '' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          set -euo pipefail
          INPUT_BASE_VERSION="${{ github.event.inputs.base_version || '' }}"
          if [[ -n "${INPUT_BASE_VERSION}" ]]; then
            BASE_VERSION="${INPUT_BASE_VERSION}"
          else
            BASE_VERSION="${BASE_VERSION_DEFAULT}"
          fi

          BUILD_NUM_DEC="${{ github.run_number }}"
          BUILD_SEQ=$(printf "%03d" "${BUILD_NUM_DEC}")
          FULL_VERSION="${BASE_VERSION}.${BUILD_SEQ}"
          BRANCH_NAME="${GITHUB_REF_NAME}"
          BRANCH_SAFE=$(echo "${BRANCH_NAME}" | sed 's#[^A-Za-z0-9._/-]#-#g')
          TAG_NAME="android/${BRANCH_SAFE}/v${FULL_VERSION}"
          ARTIFACT_PREFIX="android-${BASE_VERSION}-${BUILD_SEQ}"

          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_num_dec=${BUILD_NUM_DEC}" >> "$GITHUB_OUTPUT"
          echo "build_seq=${BUILD_SEQ}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=${ARTIFACT_PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: kiki_web
        run: flutter pub get

      - name: Prepare Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_STORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Missing required Android signing secrets."
            echo "Please set: ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi

          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > kiki_web/ci_release.jks

          cat > kiki_web/android/key.properties <<EOF
          storePassword=${ANDROID_STORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=../ci_release.jks
          EOF

      - name: Build Android APK (release)
        working-directory: kiki_web
        run: |
          flutter build apk --release \
            --build-name "${{ steps.meta.outputs.full_version }}" \
            --build-number "${{ steps.meta.outputs.build_num_dec }}"

      - name: Build Android App Bundle (release)
        working-directory: kiki_web
        run: |
          flutter build appbundle --release \
            --build-name "${{ steps.meta.outputs.full_version }}" \
            --build-number "${{ steps.meta.outputs.build_num_dec }}"

      - name: Upload APK to Qiniu (2 fixed names)
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY || secrets.DEPLOY_QINIU_ACCESS_KEY || secrets.KIKI_QINIU_ACCESS_KEY || vars.QINIU_ACCESS_KEY || vars.DEPLOY_QINIU_ACCESS_KEY || vars.KIKI_QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY || secrets.DEPLOY_QINIU_SECRET_KEY || secrets.KIKI_QINIU_SECRET_KEY || vars.QINIU_SECRET_KEY || vars.DEPLOY_QINIU_SECRET_KEY || vars.KIKI_QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET || secrets.DEPLOY_QINIU_BUCKET || secrets.KIKI_QINIU_BUCKET || vars.QINIU_BUCKET || vars.DEPLOY_QINIU_BUCKET || vars.KIKI_QINIU_BUCKET }}
          QINIU_UPLOAD_URL: ${{ env.QINIU_UPLOAD_URL }}
          QINIU_UPLOAD_REGION: ${{ env.QINIU_UPLOAD_REGION }}
          QINIU_DOMAIN: ${{ env.QINIU_DOMAIN }}
          QINIU_DOWNAPP_PREFIX: ${{ env.QINIU_DOWNAPP_PREFIX }}
        run: |
          set -euo pipefail

          # Fallback: load Qiniu credentials from repository dotenv file when
          # secrets/vars are not available in this workflow context.
          if [[ -f "kiki_server/.env" ]]; then
            if [[ -z "${QINIU_ACCESS_KEY}" ]]; then
              QINIU_ACCESS_KEY="$(grep -E '^QINIU_ACCESS_KEY=' kiki_server/.env | tail -n1 | cut -d'=' -f2- || true)"
            fi
            if [[ -z "${QINIU_SECRET_KEY}" ]]; then
              QINIU_SECRET_KEY="$(grep -E '^QINIU_SECRET_KEY=' kiki_server/.env | tail -n1 | cut -d'=' -f2- || true)"
            fi
            if [[ -z "${QINIU_BUCKET}" ]]; then
              QINIU_BUCKET="$(grep -E '^QINIU_BUCKET=' kiki_server/.env | tail -n1 | cut -d'=' -f2- || true)"
            fi
            if [[ -z "${QINIU_DOWNAPP_PREFIX}" ]]; then
              QINIU_DOWNAPP_PREFIX="$(grep -E '^QINIU_DOWNAPP_PREFIX=' kiki_server/.env | tail -n1 | cut -d'=' -f2- || true)"
            fi
          fi

          if [[ -z "${QINIU_DOWNAPP_PREFIX}" ]]; then
            QINIU_DOWNAPP_PREFIX="download/hikiki"
          fi

          if [[ -z "${QINIU_ACCESS_KEY}" || -z "${QINIU_SECRET_KEY}" || -z "${QINIU_BUCKET}" ]]; then
            echo "Missing required Qiniu credentials for upload."
            echo "Tried (in order):"
            echo "- QINIU_ACCESS_KEY / DEPLOY_QINIU_ACCESS_KEY / KIKI_QINIU_ACCESS_KEY"
            echo "- QINIU_SECRET_KEY / DEPLOY_QINIU_SECRET_KEY / KIKI_QINIU_SECRET_KEY"
            echo "- QINIU_BUCKET / DEPLOY_QINIU_BUCKET / KIKI_QINIU_BUCKET"
            echo "- kiki_server/.env: QINIU_ACCESS_KEY / QINIU_SECRET_KEY / QINIU_BUCKET"
            echo "Please configure them in repository Secrets (preferred) or Variables."
            exit 1
          fi

          python -m pip install --upgrade pip qiniu

          python - <<'PY'
          import os
          import time
          from pathlib import Path

          from qiniu import Auth, CdnManager, put_file, etag

          ak = os.environ["QINIU_ACCESS_KEY"]
          sk = os.environ["QINIU_SECRET_KEY"]
          bucket = os.environ["QINIU_BUCKET"]
          domain = os.environ["QINIU_DOMAIN"].strip()
          prefix = os.environ.get("QINIU_DOWNAPP_PREFIX", "download/hikiki").strip("/")

          apk_path = Path("kiki_web/build/app/outputs/flutter-apk/app-release.apk")
          if not apk_path.exists():
            raise SystemExit(f"APK not found: {apk_path}")

          keys = [
            f"{prefix}/hikiki_app.apk",
            f"{prefix}/hikiki_app_new.apk",
          ]

          q = Auth(ak, sk)

          def upload_one(key: str) -> str:
            token = q.upload_token(bucket, key, 3600)

            last_err = None
            for attempt in range(1, 4):
              try:
                print(f"[INFO] Uploading {key} (attempt {attempt}/3)...")
                ret, info = put_file(token, key, str(apk_path), check_crc=True)

                if info.status_code != 200:
                  raise RuntimeError(f"HTTP {info.status_code}: {info.text_body}")

                if ret.get("key") != key:
                  raise RuntimeError(f"Qiniu key mismatch: {ret}")

                if domain.startswith("http://") or domain.startswith("https://"):
                  url = f"{domain.rstrip('/')}/{key}"
                else:
                  url = f"https://{domain}/{key}"

                print(f"[SUCCESS] Uploaded to {url}")
                return url
              except Exception as e:
                last_err = e
                err_type = type(e).__name__
                if attempt < 3:
                  sleep_s = min(2 ** attempt, 12)
                  print(f"[WARN] Upload failed (attempt {attempt}/3) error={err_type}: {e}; retry in {sleep_s}s")
                  time.sleep(sleep_s)
                else:
                  print(f"[ERROR] Upload failed after 3 attempts: {e}")

            raise SystemExit(f"Upload failed for {key}. Last error: {last_err}")

          urls = [upload_one(k) for k in keys]
          Path("qiniu-upload-urls.txt").write_text("\n".join(urls) + "\n", encoding="utf-8")

          print("\nRefreshing Qiniu CDN cache...")
          cdn_manager = CdnManager(q)
          refresh_ret, refresh_info = cdn_manager.refresh_urls(urls)
          if refresh_info.status_code != 200:
            raise SystemExit(
              "Qiniu CDN refresh failed: "
              f"HTTP {refresh_info.status_code}: {refresh_info.text_body}"
            )

          Path("qiniu-cdn-refresh-result.txt").write_text(
            f"status_code={refresh_info.status_code}\n"
            f"response={refresh_ret}\n"
            f"urls={urls}\n",
            encoding="utf-8",
          )
          print(f"[SUCCESS] Qiniu CDN refresh submitted for {len(urls)} URL(s)")

          print("\nAll uploads completed successfully!")
          print("URLs:")
          for u in urls:
            print(f"  {u}")
          PY

      - name: Create and push build tag
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.meta.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Android release ${{ steps.meta.outputs.full_version }}"
          git push origin "${TAG_NAME}"

      - name: Generate build summary
        run: |
          set -euo pipefail
          cat > build-summary.md <<EOF
          # Android Build Summary

          - Base version: ${{ steps.meta.outputs.base_version }}
          - Build sequence: ${{ steps.meta.outputs.build_seq }}
          - Full version (X.Y.Z.AUTO): ${{ steps.meta.outputs.full_version }}
          - Android versionName: ${{ steps.meta.outputs.full_version }}
          - Android versionCode: ${{ steps.meta.outputs.build_num_dec }}
          - Branch: ${{ steps.meta.outputs.branch_name }}
          - Tag: ${{ steps.meta.outputs.tag_name }}
          - Workflow trigger: ${{ github.event_name }}

          ## Recent commit summary
          EOF

          if [[ -f qiniu-upload-urls.txt ]]; then
            {
              echo
              echo "## Qiniu APK URLs"
              while IFS= read -r line; do
                [[ -n "$line" ]] && echo "- $line"
              done < qiniu-upload-urls.txt
            } >> build-summary.md
          fi

          if [[ -f qiniu-cdn-refresh-result.txt ]]; then
            {
              echo
              echo "## Qiniu CDN Refresh"
              sed 's/^/- /' qiniu-cdn-refresh-result.txt
            } >> build-summary.md
          fi

          git log --oneline -n 15 >> build-summary.md
          cat build-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_prefix }}-apk
          path: kiki_web/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_prefix }}-aab
          path: kiki_web/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload build summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_prefix }}-summary
          path: build-summary.md
          if-no-files-found: error

      - name: Upload Qiniu URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_prefix }}-qiniu-urls
          path: qiniu-upload-urls.txt
          if-no-files-found: error

      - name: Upload Qiniu CDN refresh artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_prefix }}-qiniu-cdn-refresh
          path: qiniu-cdn-refresh-result.txt
          if-no-files-found: error
