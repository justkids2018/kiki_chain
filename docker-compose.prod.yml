version: '3.8'

services:
  # ===================== 数据库 (PostgreSQL) =====================
  postgres:
    image: postgres:15
    container_name: hikiki_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hikiki_db
      TZ: Asia/Shanghai
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "log_min_duration_statement=1000"
    volumes:
      - hikiki_pgdata:/var/lib/postgresql/data
      - ./docs/database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./kiki_server/migrations/002_scene_tables.sql:/docker-entrypoint-initdb.d/02_scene_tables.sql:ro
    ports:
      - "5432:5432"
    networks:
      - hikiki-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hikiki_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== Rust 后端应用 =====================
  backend:
    build:
      context: ./kiki_server
      dockerfile: Dockerfile
    container_name: hikiki_backend
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hikiki_db
      JWT_SECRET: hikiki-prod-jwt-secret-2024
      LOG_LEVEL: info
      LOG_COLORS: "false"
      TZ: Asia/Shanghai
    networks:
      - hikiki-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ===================== 管理后台 (Vue) =====================
  admin:
    build:
      context: ./kiki_admin
      dockerfile: Dockerfile
    container_name: hikiki_admin
    restart: always
    environment:
      VITE_API_BASE_URL: https://mtrain.xyz/api
    networks:
      - hikiki-network

  # ===================== Nginx 反向代理 =====================
  nginx:
    image: nginx:alpine
    container_name: hikiki_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - hikiki-network
    depends_on:
      - backend
      - admin

  # ===================== SSL 证书自动续期 =====================
  certbot:
    image: certbot/certbot
    container_name: hikiki_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

# ===================== 网络 =====================
networks:
  hikiki-network:
    driver: bridge

# ===================== 数据卷 =====================
volumes:
  hikiki_pgdata:
    driver: local
