name: Native iOS Release Build

on:
  push:
    branches: [main]
    paths:
      - "kiki_ios/**"
      - ".github/workflows/ios-native-release.yml"
  workflow_dispatch:
    inputs:
      export_method:
        description: "How the signed IPA will be distributed"
        required: true
        type: choice
        default: app-store-connect
        options:
          - app-store-connect
          - release-testing
          - enterprise

permissions:
  contents: read

concurrency:
  group: native-ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-ios:
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      IOS_NATIVE_EXPORT_METHOD: ${{ inputs.export_method || vars.IOS_NATIVE_EXPORT_METHOD || 'app-store-connect' }}
      IOS_NATIVE_BASE_VERSION: ${{ vars.IOS_NATIVE_BASE_VERSION || '1.0.0' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "${DEVELOPER_DIR}"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compute build metadata
        id: meta
        run: |
          set -euo pipefail
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "marketing_version=${IOS_NATIVE_BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=kiki-native-ios-${IOS_NATIVE_BASE_VERSION}-${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare native iOS signing assets
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          decode_base64() {
            if base64 --help >/dev/null 2>&1; then base64 --decode; else base64 -D; fi
          }

          if [[ -z "${IOS_CERTIFICATE_P12_BASE64}" || -z "${IOS_CERTIFICATE_PASSWORD}" || -z "${IOS_PROVISIONING_PROFILE_BASE64}" ]]; then
            echo "Missing signing data. Configure IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD and IOS_PROVISIONING_PROFILE_BASE64 for com.just.kiki."
            exit 1
          fi
          if [[ -z "${IOS_KEYCHAIN_PASSWORD}" ]]; then
            IOS_KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          fi
          case "${IOS_NATIVE_EXPORT_METHOD}" in
            app-store-connect|release-testing|enterprise) ;;
            *) echo "Unsupported export method: ${IOS_NATIVE_EXPORT_METHOD}"; exit 1 ;;
          esac
          SIGNING_CERTIFICATE="Apple Distribution"

          CERT_PATH="$RUNNER_TEMP/kiki-native-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/kiki-native.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/kiki-native-profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/kiki-native-build.keychain-db"
          echo "${IOS_CERTIFICATE_P12_BASE64}" | decode_base64 > "${CERT_PATH}"
          echo "${IOS_PROVISIONING_PROFILE_BASE64}" | decode_base64 > "${PROFILE_PATH}"
          security cms -D -i "${PROFILE_PATH}" > "${PROFILE_PLIST}"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "${PROFILE_PLIST}")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "${PROFILE_PLIST}")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "${PROFILE_PLIST}")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "${PROFILE_PLIST}")
          BUNDLE_ID="${APP_IDENTIFIER#*.}"
          EXPECTED_BUNDLE_ID="com.just.kiki"
          if [[ "${BUNDLE_ID}" != "${EXPECTED_BUNDLE_ID}" ]]; then
            echo "Provisioning profile bundle ID ${BUNDLE_ID} does not match ${EXPECTED_BUNDLE_ID}."
            exit 1
          fi

          security create-keychain -p "${IOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${IOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security import "${CERT_PATH}" -P "${IOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -k "${IOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          SIGNING_IDENTITIES="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}")"
          if ! grep -Fq "${SIGNING_CERTIFICATE}" <<< "${SIGNING_IDENTITIES}"; then
            echo "The imported P12 does not contain an ${SIGNING_CERTIFICATE} signing identity."
            exit 1
          fi

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "${PROFILE_DIR}"
          cp "${PROFILE_PATH}" "${PROFILE_DIR}/${PROFILE_UUID}.mobileprovision"

          EXPORT_OPTIONS="$RUNNER_TEMP/KikiNative-ExportOptions.plist"
          cat > "${EXPORT_OPTIONS}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${IOS_NATIVE_EXPORT_METHOD}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${SIGNING_CERTIFICATE}</string>
            <key>teamID</key><string>${PROFILE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict><key>${EXPECTED_BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>stripSwiftSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF

          {
            echo "IOS_NATIVE_PROFILE_UUID=${PROFILE_UUID}"
            echo "IOS_NATIVE_PROFILE_NAME=${PROFILE_NAME}"
            echo "IOS_NATIVE_TEAM_ID=${PROFILE_TEAM_ID}"
            echo "IOS_NATIVE_SIGNING_CERTIFICATE=${SIGNING_CERTIFICATE}"
            echo "IOS_NATIVE_KEYCHAIN_PATH=${KEYCHAIN_PATH}"
            echo "IOS_NATIVE_PROFILE_PATH=${PROFILE_DIR}/${PROFILE_UUID}.mobileprovision"
            echo "IOS_NATIVE_EXPORT_OPTIONS=${EXPORT_OPTIONS}"
          } >> "$GITHUB_ENV"

      - name: Archive native SwiftUI app
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$PWD/kiki_ios/build/ios/archive/KikiNative.xcarchive"
          mkdir -p "$(dirname "${ARCHIVE_PATH}")"
          xcodebuild \
            -project kiki_ios/KikiNative.xcodeproj \
            -scheme KikiNative \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${ARCHIVE_PATH}" \
            MARKETING_VERSION="${IOS_NATIVE_BASE_VERSION}" \
            CURRENT_PROJECT_VERSION="${{ steps.meta.outputs.build_number }}" \
            PRODUCT_BUNDLE_IDENTIFIER=com.just.kiki \
            DEVELOPMENT_TEAM="${IOS_NATIVE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${IOS_NATIVE_SIGNING_CERTIFICATE}" \
            PROVISIONING_PROFILE_SPECIFIER="${IOS_NATIVE_PROFILE_NAME}" \
            archive

      - name: Export signed IPA
        run: |
          set -euo pipefail
          EXPORT_PATH="$PWD/kiki_ios/build/ios/ipa"
          mkdir -p "${EXPORT_PATH}"
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/kiki_ios/build/ios/archive/KikiNative.xcarchive" \
            -exportPath "${EXPORT_PATH}" \
            -exportOptionsPlist "${IOS_NATIVE_EXPORT_OPTIONS}"
          test -n "$(find "${EXPORT_PATH}" -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Generate build summary
        run: |
          {
            echo "# Native iOS Build Summary"
            echo
            echo "- Project: kiki_ios/KikiNative.xcodeproj"
            echo "- Bundle ID: com.just.kiki"
            echo "- Marketing version: ${IOS_NATIVE_BASE_VERSION}"
            echo "- Build number: ${{ steps.meta.outputs.build_number }}"
            echo "- Export method: ${IOS_NATIVE_EXPORT_METHOD}"
            echo "- Provisioning profile: ${IOS_NATIVE_PROFILE_NAME} (${IOS_NATIVE_PROFILE_UUID})"
            echo "- Branch: ${GITHUB_REF_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-ipa
          path: kiki_ios/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-archive
          path: kiki_ios/build/ios/archive/KikiNative.xcarchive
          if-no-files-found: error
          retention-days: 14

      - name: Clean signing assets
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${IOS_NATIVE_KEYCHAIN_PATH:-}" ]]; then security delete-keychain "${IOS_NATIVE_KEYCHAIN_PATH}" || true; fi
          if [[ -n "${IOS_NATIVE_PROFILE_PATH:-}" ]]; then rm -f "${IOS_NATIVE_PROFILE_PATH}" || true; fi
