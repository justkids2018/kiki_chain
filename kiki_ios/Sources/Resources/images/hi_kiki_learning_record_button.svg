<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF4"/>
      <stop offset="100%" stop-color="#FFF0C8"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7A4A22" flood-opacity="0.18"/>
    </filter>
    <filter id="iconShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#3F2514" flood-opacity="0.18"/>
    </filter>
  </defs>


  <style>
    .btn { transform-origin: 40px 40px; animation: float 3.2s ease-in-out infinite; }
    .icon { transform-origin: 40px 40px; animation: pop 2.6s ease-in-out infinite; }
    .accent { animation: sparkle 2.2s ease-in-out infinite; transform-origin:center; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    @keyframes sparkle { 0%,100% { opacity:.65; transform:scale(.9); } 50% { opacity:1; transform:scale(1.12); } }
  </style>


  <g class="btn">
    <rect x="8" y="12" width="64" height="56" rx="24" fill="url(#cream)" filter="url(#softShadow)"/>
    <rect x="13" y="17" width="54" height="46" rx="19" fill="none" stroke="#E9C98D" stroke-width="2"/>
    <g class="icon" filter="url(#iconShadow)">
      <path d="M25 51 C30 43 34 37 39 43 C43 48 47 32 55 28" fill="none" stroke="#7A4A22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="25" cy="51" r="4" fill="#FFD65A"/>
      <circle cx="39" cy="43" r="4" fill="#8ED96B"/>
      <circle cx="55" cy="28" r="4" fill="#FFB86A"/>
      <path d="M23 25 H47" stroke="#7A4A22" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    </g>
    <path class="accent" d="M57 50 L61 58 L70 59 L63 65 L65 74 L57 69 L49 74 L51 65 L44 59 L53 58 Z" fill="#FFD65A"/>
  </g>

</svg>
