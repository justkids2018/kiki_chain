version: '3.8'

services:
  # ===================== 数据库 (PostgreSQL) =====================
  postgres:
    image: postgres:15
    container_name: hikiki_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hikiki_db
      TZ: Asia/Shanghai
    volumes:
      # 持久化数据
      - hikiki_pgdata:/var/lib/postgresql/data
      # 自动执行初始化脚本
      - ../kiki_web/doc/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - hikiki-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hikiki_db"]
      interval: 10s
      timeout: 5s
      retries: 5

# ===================== 网络 =====================
networks:
  hikiki-network:
    driver: bridge

# ===================== 数据卷 =====================
volumes:
  hikiki_pgdata:
    driver: local
