<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hi Kiki Story Video</title>
    <meta name="description" content="Hi Kiki 故事视频页" />
    <style>
        :root {
            --bg: #0f1115;
            --card: #161920;
            --ink: #f4f6fb;
            --muted: #a5adbd;
            --brand: #ffb703;
            --line: rgba(255, 255, 255, 0.12);
            --overlay: linear-gradient(180deg, rgba(6, 8, 11, 0.04) 0%, rgba(6, 8, 11, 0.7) 60%, rgba(6, 8, 11, 0.88) 100%);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top right, #252a35 0%, #0f1115 35%, #0f1115 100%);
            color: var(--ink);
            font-family: "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
        }

        .wrap {
            width: min(1040px, calc(100vw - 24px));
            margin: 18px auto 30px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 16px;
            align-items: start;
        }

        .stage {
            border: 1px solid var(--line);
            border-radius: 20px;
            background: #0b0d12;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            min-height: 72vh;
            position: relative;
        }

        .media {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: #050608;
        }

        .scene {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: scale(1.02);
            transition: opacity 420ms ease, transform 420ms ease;
        }

        .scene.active {
            opacity: 1;
            transform: scale(1);
        }

        .scene img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: kenburns var(--duration, 6s) ease-in-out both;
            filter: saturate(1.08);
        }

        @keyframes kenburns {
            0% {
                transform: scale(1.04);
            }

            100% {
                transform: scale(1.12);
            }
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: var(--overlay);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
            gap: 10px;
        }

        .kicker {
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #ffd166;
            font-weight: 700;
        }

        .title {
            margin: 0;
            font-size: clamp(26px, 3.8vw, 42px);
            line-height: 1.08;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
            max-width: 88%;
        }

        .progress {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            gap: 4px;
            padding: 8px;
            z-index: 3;
        }

        .bar {
            flex: 1;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.24);
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd166 0%, #ffb703 100%);
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--card);
            padding: 14px;
            position: sticky;
            top: 12px;
        }

        .panel h2 {
            margin: 0;
            font-size: 16px;
        }

        .panel p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
        }

        .row {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            border: 1px solid var(--line);
            background: #10131a;
            color: #f4f6fb;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        button.primary {
            background: linear-gradient(120deg, #f59e0b 0%, #ffb703 100%);
            color: #17120a;
            border-color: transparent;
        }

        .script {
            margin-top: 12px;
            border-top: 1px solid var(--line);
            padding-top: 12px;
        }

        .line {
            margin: 0 0 8px;
            padding: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 12px;
            line-height: 1.6;
            color: #d5dbeb;
        }

        .line b {
            color: #ffcf70;
            font-weight: 700;
        }

        .hint {
            margin-top: 8px;
            color: #9aa2b5;
            font-size: 11px;
            line-height: 1.6;
        }

        @media (max-width: 920px) {
            .wrap {
                grid-template-columns: 1fr;
            }

            .panel {
                position: static;
            }

            .stage {
                min-height: 62vh;
            }

            .subtitle {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="wrap">
        <section class="stage">
            <div class="progress" id="progress"></div>
            <div class="media" id="media"></div>
            <div class="overlay">
                <div class="kicker" id="kicker">Hi Kiki Story</div>
                <h1 class="title" id="title"></h1>
                <p class="subtitle" id="subtitle"></p>
            </div>
        </section>

        <aside class="panel">
            <h2>Video Kit 控制台</h2>
            <p>先用 HTML 跑通故事节奏，再录屏导出 MP4。这是最低成本方案，适合高频发布。</p>
            <div class="row">
                <button id="prevBtn">上一镜头</button>
                <button id="nextBtn">下一镜头</button>
            </div>
            <div class="row">
                <button id="pauseBtn">暂停</button>
                <button id="playBtn" class="primary">播放</button>
            </div>

            <section class="script" id="script"></section>
            <p class="hint">提示：替换下方配置中的 scenes 与 narration，即可复用同一模板生成新视频。</p>
        </aside>
    </main>

    <script>
        const VIDEO_CONFIG = {
            title: "Hi Kiki: 看图说词，开口表达",
            subtitle: "30 秒故事版：从识图到开口表达，孩子在真实场景里自然学会单词和句子。",
            autoPlay: true,
            scenes: [
                {
                    image: "../img/Screenshot_2026-05-31-16-23-31-162_com.just.kiki.jpg",
                    title: "第一步：孩子先看到真实场景",
                    subtitle: "不先背单词，先理解画面。",
                    durationMs: 4200
                },
                {
                    image: "../img/Screenshot_2026-05-31-16-23-37-967_com.just.kiki.jpg",
                    title: "第二步：点击学习，建立词汇连接",
                    subtitle: "把图像、读音、词义放到同一条学习链路。",
                    durationMs: 4200
                },
                {
                    image: "../img/Screenshot_2026-05-31-16-24-34-163_com.just.kiki.jpg",
                    title: "第三步：在互动里输出表达",
                    subtitle: "通过练习反馈形成正向记忆。",
                    durationMs: 4200
                }
            ],
            narration: [
                { speaker: "家长", text: "我想找一个孩子愿意主动学的英语启蒙方式。" },
                { speaker: "孩子", text: "我喜欢这种看图点一点、还能听和说的方式。" },
                { speaker: "旁白", text: "Hi Kiki 让孩子在真实场景中自然理解、自然开口。" }
            ]
        };

        const media = document.getElementById("media");
        const progress = document.getElementById("progress");
        const titleEl = document.getElementById("title");
        const subtitleEl = document.getElementById("subtitle");
        const kicker = document.getElementById("kicker");
        const script = document.getElementById("script");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const playBtn = document.getElementById("playBtn");

        let current = 0;
        let running = VIDEO_CONFIG.autoPlay;
        let timer = null;
        let startTime = 0;
        let progressTimer = null;

        const bars = VIDEO_CONFIG.scenes.map(() => {
            const bar = document.createElement("div");
            bar.className = "bar";
            const fill = document.createElement("div");
            fill.className = "bar-fill";
            bar.appendChild(fill);
            progress.appendChild(bar);
            return fill;
        });

        const sceneNodes = VIDEO_CONFIG.scenes.map((scene) => {
            const node = document.createElement("article");
            node.className = "scene";
            const img = document.createElement("img");
            img.src = scene.image;
            img.alt = scene.title;
            img.style.setProperty("--duration", `${Math.max(scene.durationMs, 1000)}ms`);
            node.appendChild(img);
            media.appendChild(node);
            return node;
        });

        VIDEO_CONFIG.narration.forEach((row) => {
            const p = document.createElement("p");
            p.className = "line";
            p.innerHTML = `<b>${row.speaker}</b>：${row.text}`;
            script.appendChild(p);
        });

        const stopTimers = () => {
            if (timer) {
                clearTimeout(timer);
                timer = null;
            }
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
        };

        const syncBars = (progressValue) => {
            bars.forEach((fill, index) => {
                if (index < current) {
                    fill.style.width = "100%";
                } else if (index > current) {
                    fill.style.width = "0%";
                } else {
                    fill.style.width = `${Math.max(0, Math.min(100, progressValue))}%`;
                }
            });
        };

        const render = () => {
            const scene = VIDEO_CONFIG.scenes[current];
            sceneNodes.forEach((node, idx) => {
                node.classList.toggle("active", idx === current);
            });
            kicker.textContent = `Scene ${current + 1}/${VIDEO_CONFIG.scenes.length}`;
            titleEl.textContent = scene.title || VIDEO_CONFIG.title;
            subtitleEl.textContent = scene.subtitle || VIDEO_CONFIG.subtitle;
            syncBars(0);
            stopTimers();

            if (!running) {
                return;
            }

            startTime = Date.now();
            progressTimer = setInterval(() => {
                const ratio = ((Date.now() - startTime) / scene.durationMs) * 100;
                syncBars(ratio);
            }, 80);

            timer = setTimeout(() => {
                current = (current + 1) % VIDEO_CONFIG.scenes.length;
                render();
            }, scene.durationMs);
        };

        prevBtn.addEventListener("click", () => {
            current = (current - 1 + VIDEO_CONFIG.scenes.length) % VIDEO_CONFIG.scenes.length;
            render();
        });

        nextBtn.addEventListener("click", () => {
            current = (current + 1) % VIDEO_CONFIG.scenes.length;
            render();
        });

        pauseBtn.addEventListener("click", () => {
            running = false;
            stopTimers();
        });

        playBtn.addEventListener("click", () => {
            if (!running) {
                running = true;
                render();
            }
        });

        render();
    </script>
</body>

</html>
