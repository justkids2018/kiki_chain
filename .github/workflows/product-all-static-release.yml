name: Product All Static Site Release

on:
  workflow_dispatch:
    inputs:
      install_nginx:
        description: "Install or update nginx config for all.keepthinking.me"
        required: false
        type: boolean
        default: false
      skip_url_check:
        description: "Skip public URL check after deploy"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  SITE_SOURCE_DIR: kiki_product_html/all
  SITE_DOMAIN: all.keepthinking.me
  SITE_URL: https://all.keepthinking.me/
  DEFAULT_REMOTE_DIR: ~/product_all_static
  DEFAULT_TLS_CERT_DOMAIN: all.keepthinking.me

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          set -euo pipefail
          test -f "${SITE_SOURCE_DIR}/index.html"
          test -f "${SITE_SOURCE_DIR}/img/app_icon.png"
          grep -q "https://down.kiki.keepthinking.me/index.html" "${SITE_SOURCE_DIR}/index.html"
          find "${SITE_SOURCE_DIR}" -type f | sort

      - name: Validate deploy secrets
        env:
          TENCENT_SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "${TENCENT_SSH_PRIVATE_KEY}" || (echo "Missing secret: TENCENT_SSH_PRIVATE_KEY" && exit 1)
          test -n "${DEPLOY_SERVER_IP}" || (echo "Missing secret: DEPLOY_SERVER_IP" && exit 1)
          test -n "${DEPLOY_SSH_USER}" || (echo "Missing secret: DEPLOY_SSH_USER" && exit 1)

      - name: Setup SSH
        env:
          TENCENT_SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
        run: |
          set -euo pipefail
          SERVER_IP="$(echo "${DEPLOY_SERVER_IP}" | tr -d '[:space:]')"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "${TENCENT_SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${SERVER_IP}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Package static site
        run: |
          set -euo pipefail
          tar -C "${SITE_SOURCE_DIR}" -czf /tmp/product-all-static-site.tar.gz .
          tar -tzf /tmp/product-all-static-site.tar.gz | sort

      - name: Upload and switch release
        id: deploy
        env:
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          PRODUCT_ALL_REMOTE_DIR: ${{ secrets.PRODUCT_ALL_REMOTE_DIR }}
        run: |
          set -euo pipefail
          SERVER_IP="$(echo "${DEPLOY_SERVER_IP}" | tr -d '[:space:]')"
          SSH_USER="$(echo "${DEPLOY_SSH_USER}" | tr -d '[:space:]')"
          REMOTE_DIR="${PRODUCT_ALL_REMOTE_DIR:-${DEFAULT_REMOTE_DIR}}"
          RELEASE_ID="sha-${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          REMOTE_TAR="/tmp/product-all-static-site-${RELEASE_ID}.tar.gz"

          scp /tmp/product-all-static-site.tar.gz "${SSH_USER}@${SERVER_IP}:${REMOTE_TAR}"
          ssh "${SSH_USER}@${SERVER_IP}" "set -euo pipefail
            REMOTE_DIR='${REMOTE_DIR}'
            RELEASE_ID='${RELEASE_ID}'
            REMOTE_TAR='${REMOTE_TAR}'
            RELEASE_DIR=\"\${REMOTE_DIR}/releases/\${RELEASE_ID}\"
            mkdir -p \"\${RELEASE_DIR}\"
            tar -xzf \"\${REMOTE_TAR}\" -C \"\${RELEASE_DIR}\"
            rm -f \"\${REMOTE_TAR}\"
            ln -sfn \"\${RELEASE_DIR}\" \"\${REMOTE_DIR}/current\"
            find \"\${REMOTE_DIR}/releases\" -mindepth 1 -maxdepth 1 -type d | sort | head -n -5 | xargs -r rm -rf
            readlink -f \"\${REMOTE_DIR}/current\"
          " | tee /tmp/product-all-current-path.txt

          CURRENT_PATH="$(tail -n 1 /tmp/product-all-current-path.txt)"
          echo "current_path=${CURRENT_PATH}" >> "$GITHUB_OUTPUT"
          echo "remote_dir=${REMOTE_DIR}" >> "$GITHUB_OUTPUT"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Install nginx config
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.install_nginx == 'true' }}
        env:
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          PRODUCT_ALL_TLS_CERT_DOMAIN: ${{ secrets.PRODUCT_ALL_TLS_CERT_DOMAIN }}
          CURRENT_PATH: ${{ steps.deploy.outputs.current_path }}
        run: |
          set -euo pipefail
          SERVER_IP="$(echo "${DEPLOY_SERVER_IP}" | tr -d '[:space:]')"
          SSH_USER="$(echo "${DEPLOY_SSH_USER}" | tr -d '[:space:]')"
          TLS_CERT_DOMAIN="${PRODUCT_ALL_TLS_CERT_DOMAIN:-${DEFAULT_TLS_CERT_DOMAIN}}"

          cat >/tmp/product-all.conf <<EOF
          server {
            listen 80;
            server_name ${SITE_DOMAIN};

            location /.well-known/acme-challenge/ {
              root /var/www/certbot;
              default_type text/plain;
            }

            location / {
              return 301 https://\$host\$request_uri;
            }
          }

          server {
            listen 443 ssl http2;
            server_name ${SITE_DOMAIN};

            ssl_certificate /etc/letsencrypt/live/${TLS_CERT_DOMAIN}/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/${TLS_CERT_DOMAIN}/privkey.pem;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_prefer_server_ciphers on;
            ssl_session_cache shared:SSL:10m;

            root ${CURRENT_PATH};
            index index.html;

            location / {
              try_files \$uri \$uri/ /index.html;
            }
          }
          EOF

          scp /tmp/product-all.conf "${SSH_USER}@${SERVER_IP}:/tmp/product-all.conf"
          ssh "${SSH_USER}@${SERVER_IP}" "sudo mkdir -p /etc/nginx/conf.d && sudo mv /tmp/product-all.conf /etc/nginx/conf.d/product-all.conf && sudo nginx -t && sudo systemctl reload nginx"

      - name: Verify public URL
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.skip_url_check == 'true') }}
        run: |
          set -euo pipefail
          curl -fsSIL --retry 5 --retry-delay 3 "${SITE_URL}" | tee /tmp/product-all-url-check.txt

      - name: Deployment summary
        if: always()
        run: |
          echo "### Product All Static Site Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source | \`${SITE_SOURCE_DIR}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | \`${SITE_URL}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Remote Dir | \`${{ steps.deploy.outputs.remote_dir }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release | \`${{ steps.deploy.outputs.release_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Current Path | \`${{ steps.deploy.outputs.current_path }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | \`${{ job.status }}\` |" >> "$GITHUB_STEP_SUMMARY"
