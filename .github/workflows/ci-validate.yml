name: CI Validate

on:
  push:
    branches:
      - main
      - kiki
  pull_request:

jobs:
  validate-flutter:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate database migrations
        run: ./scripts/check-db-migrations.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: kiki_web
        run: flutter pub get

      - name: Flutter analyze
        working-directory: kiki_web
        run: flutter analyze

      # 暂时跳过测试，只做代码分析
