name: Docker Build On Push

on:
  push:
    branches:
      - "kiki"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag override (default: sha-<commit>)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/justkids2018/kiki-chain-backend
  IMAGE_ADMIN: ghcr.io/justkids2018/kiki-chain-admin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="sha-${GITHUB_SHA::8}"
          fi
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./kiki_server
          file: ./kiki_server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_BACKEND }}:latest

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: ./kiki_admin
          file: ./kiki_admin/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=https://kiki.keepthinking.me
          tags: |
            ${{ env.IMAGE_ADMIN }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_ADMIN }}:latest
