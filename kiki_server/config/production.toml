# Hi Kiki - 生产环境配置
# 用于正式部署，注重安全性和性能
# 注意：日志配置独立处理，自动使用生产级日志配置

# ==========================================
# 服务器配置
# ==========================================
[server]
# 生产环境绑定所有接口，用于Docker容器或云服务器
host = "0.0.0.0"
port = 8001

# 生产环境CORS配置：仅允许正式域名，严格控制安全
cors_origins = [
    "https://mtrain.xyz",
    "https://www.mtrain.xyz"
]

# ==========================================
# 安全配置
# ==========================================
[security]
# 生产环境JWT过期时间适中，平衡安全性与用户体验
jwt_expiration_hours = 24
