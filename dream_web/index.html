<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>魔法森林大冒险 - 发现你的动物守护者</title>

  <!-- Google Fonts: 儿童友好圆润字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- 预加载关键资源 -->
  <link rel="preload" href="css/variables.css" as="style">
  <link rel="preload" href="js/app.js" as="script">

  <!-- CSS 加载顺序 -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/scenes.css">

  <!-- 内联关键CSS（loading画面） -->
  <style>
    /* ===== Loading 画面内联样式 ===== */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0D2B1F 0%, #1A3C34 40%, #1F4D3A 70%, #0D2B1F 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      overflow: hidden;
      transition: opacity 0.5s ease;
    }

    /* 森林背景微光粒子 */
    #loading-screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(2px 2px at 20% 30%, rgba(255, 200, 50, 0.3), transparent),
        radial-gradient(2px 2px at 80% 20%, rgba(150, 255, 150, 0.2), transparent),
        radial-gradient(2px 2px at 50% 70%, rgba(180, 150, 255, 0.2), transparent),
        radial-gradient(2px 2px at 70% 80%, rgba(100, 200, 255, 0.2), transparent),
        radial-gradient(1px 1px at 30% 60%, rgba(255, 255, 200, 0.3), transparent),
        radial-gradient(1px 1px at 60% 40%, rgba(200, 255, 200, 0.2), transparent),
        radial-gradient(1px 1px at 10% 80%, rgba(255, 180, 100, 0.2), transparent),
        radial-gradient(1px 1px at 90% 50%, rgba(150, 200, 255, 0.2), transparent);
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* 旋转星星容器 */
    .loading-animation {
      position: relative;
      width: 120px;
      height: 120px;
      animation: spinStar 3s linear infinite;
      z-index: 1;
    }

    @keyframes spinStar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 四色星星射线 */
    .star-ray {
      position: absolute;
      width: 8px;
      border-radius: 4px;
      top: 50%;
      left: 50%;
      transform-origin: 0 0;
    }

    /* 橙色 - 上 */
    .star-ray:nth-child(1) {
      height: 50px;
      background: linear-gradient(to top, rgba(255, 152, 0, 0.1), #FF9800);
      transform: translate(-4px, -50px);
      box-shadow: 0 0 12px rgba(255, 152, 0, 0.6);
      animation: pulse-orange 1.5s ease-in-out infinite;
    }

    /* 紫色 - 右 */
    .star-ray:nth-child(2) {
      height: 50px;
      background: linear-gradient(to top, rgba(156, 39, 176, 0.1), #9C27B0);
      transform: translate(-4px, 0) rotate(90deg);
      transform-origin: 4px 0;
      box-shadow: 0 0 12px rgba(156, 39, 176, 0.6);
      animation: pulse-purple 1.5s ease-in-out 0.375s infinite;
    }

    /* 绿色 - 下 */
    .star-ray:nth-child(3) {
      height: 50px;
      background: linear-gradient(to top, rgba(76, 175, 80, 0.1), #4CAF50);
      transform: translate(-4px, 0) rotate(180deg);
      transform-origin: 4px 0;
      box-shadow: 0 0 12px rgba(76, 175, 80, 0.6);
      animation: pulse-green 1.5s ease-in-out 0.75s infinite;
    }

    /* 蓝色 - 左 */
    .star-ray:nth-child(4) {
      height: 50px;
      background: linear-gradient(to top, rgba(33, 150, 243, 0.1), #2196F3);
      transform: translate(-4px, 0) rotate(270deg);
      transform-origin: 4px 0;
      box-shadow: 0 0 12px rgba(33, 150, 243, 0.6);
      animation: pulse-blue 1.5s ease-in-out 1.125s infinite;
    }

    /* 中心光点 */
    .star-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border-radius: 50%;
      background: radial-gradient(circle, #FFFFFF, rgba(255, 255, 255, 0.6));
      box-shadow:
        0 0 20px rgba(255, 255, 255, 0.8),
        0 0 40px rgba(255, 255, 255, 0.4),
        0 0 60px rgba(255, 200, 100, 0.2);
      animation: centerGlow 2s ease-in-out infinite alternate;
    }

    @keyframes centerGlow {
      0% { transform: scale(0.8); box-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 30px rgba(255, 255, 255, 0.3); }
      100% { transform: scale(1.2); box-shadow: 0 0 25px rgba(255, 255, 255, 1), 0 0 50px rgba(255, 255, 255, 0.5), 0 0 80px rgba(255, 200, 100, 0.3); }
    }

    @keyframes pulse-orange {
      0%, 100% { opacity: 0.6; height: 40px; }
      50% { opacity: 1; height: 55px; }
    }

    @keyframes pulse-purple {
      0%, 100% { opacity: 0.6; height: 40px; }
      50% { opacity: 1; height: 55px; }
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 0.6; height: 40px; }
      50% { opacity: 1; height: 55px; }
    }

    @keyframes pulse-blue {
      0%, 100% { opacity: 0.6; height: 40px; }
      50% { opacity: 1; height: 55px; }
    }

    /* 对角小星星装饰 */
    .star-ray-small {
      position: absolute;
      width: 5px;
      border-radius: 3px;
      top: 50%;
      left: 50%;
    }

    .star-ray-small:nth-child(6) {
      height: 30px;
      background: linear-gradient(to top, transparent, rgba(255, 200, 100, 0.6));
      transform: translate(-2.5px, -30px) rotate(45deg);
      transform-origin: 2.5px 30px;
      animation: pulse-orange 1.5s ease-in-out 0.2s infinite;
    }

    .star-ray-small:nth-child(7) {
      height: 30px;
      background: linear-gradient(to top, transparent, rgba(200, 150, 255, 0.6));
      transform: translate(-2.5px, -30px) rotate(135deg);
      transform-origin: 2.5px 30px;
      animation: pulse-purple 1.5s ease-in-out 0.6s infinite;
    }

    .star-ray-small:nth-child(8) {
      height: 30px;
      background: linear-gradient(to top, transparent, rgba(100, 220, 120, 0.6));
      transform: translate(-2.5px, -30px) rotate(225deg);
      transform-origin: 2.5px 30px;
      animation: pulse-green 1.5s ease-in-out 1.0s infinite;
    }

    .star-ray-small:nth-child(9) {
      height: 30px;
      background: linear-gradient(to top, transparent, rgba(100, 180, 255, 0.6));
      transform: translate(-2.5px, -30px) rotate(315deg);
      transform-origin: 2.5px 30px;
      animation: pulse-blue 1.5s ease-in-out 1.4s infinite;
    }

    /* 加载文字 */
    .loading-text {
      margin-top: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 4px;
      z-index: 1;
      background: linear-gradient(90deg, #FF9800, #E040FB, #4CAF50, #2196F3, #FF9800);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmerText 3s linear infinite;
    }

    @keyframes shimmerText {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* 底部装饰小点 */
    .loading-dots {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      z-index: 1;
    }

    .loading-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: dotBounce 1.4s ease-in-out infinite;
    }

    .loading-dots span:nth-child(1) {
      background: #FF9800;
      animation-delay: 0s;
    }

    .loading-dots span:nth-child(2) {
      background: #9C27B0;
      animation-delay: 0.2s;
    }

    .loading-dots span:nth-child(3) {
      background: #4CAF50;
      animation-delay: 0.4s;
    }

    .loading-dots span:nth-child(4) {
      background: #2196F3;
      animation-delay: 0.6s;
    }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-8px); opacity: 1; }
    }

    /* 错误提示 */
    .error-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0D2B1F, #1A3C34);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      color: #E8D5B7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      text-align: center;
    }

    .error-overlay .error-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .error-overlay .error-message {
      font-size: 18px;
      line-height: 1.6;
      max-width: 280px;
    }

    .error-overlay .error-retry {
      margin-top: 24px;
      padding: 12px 32px;
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
    }
  </style>
</head>
<body>
  <!-- Loading 画面 -->
  <div id="loading-screen">
    <div class="loading-animation">
      <!-- 四色主射线 -->
      <div class="star-ray"></div>
      <div class="star-ray"></div>
      <div class="star-ray"></div>
      <div class="star-ray"></div>
      <!-- 中心光点 -->
      <div class="star-center"></div>
      <!-- 四色对角小射线 -->
      <div class="star-ray-small"></div>
      <div class="star-ray-small"></div>
      <div class="star-ray-small"></div>
      <div class="star-ray-small"></div>
    </div>
    <p class="loading-text">正在施展魔法...</p>
    <div class="loading-dots">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- 应用主容器 -->
  <div id="app" style="display:none;width:100%;height:100%;position:relative;overflow:hidden;"></div>

  <!-- JS 加载顺序（注意依赖关系！） -->
  <!-- 1. 工具层 -->
  <script src="js/utils/easing.js"></script>
  <script src="js/utils/dom.js"></script>
  <script src="js/utils/device.js"></script>

  <!-- 2. 数据层 -->
  <script src="js/data/characterData.js"></script>
  <script src="js/data/storyData.js"></script>
  <script src="js/data/resultData.js"></script>
  <script src="js/data/dialogData.js"></script>

  <!-- 3. 核心引擎层 -->
  <script src="js/core/SceneManager.js"></script>
  <script src="js/core/AudioManager.js"></script>
  <script src="js/core/AnimationEngine.js"></script>
  <script src="js/core/ScoreEngine.js"></script>

  <!-- 4. 渲染层 -->
  <script src="js/renderers/CharacterRenderer.js"></script>
  <script src="js/renderers/BackgroundRenderer.js"></script>
  <script src="js/renderers/ParticleSystem.js"></script>
  <script src="js/renderers/CardRenderer.js"></script>

  <!-- 5. 场景层 -->
  <script src="js/scenes/WelcomeScene.js"></script>
  <script src="js/scenes/PrologueScene.js"></script>
  <script src="js/scenes/StoryScene.js"></script>
  <script src="js/scenes/ClimaxScene.js"></script>
  <script src="js/scenes/ResultScene.js"></script>
  <script src="js/scenes/ShareScene.js"></script>

  <!-- 6. 应用入口 -->
  <script src="js/app.js"></script>
</body>
</html>
