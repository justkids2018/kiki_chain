<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hi Kiki</title>
    <meta name="description" content="Hi Kiki 下载" />
    <style>
        :root {
            --bg: #f5f5f7;
            --ink: #1d1d1f;
            --muted: #6e6e73;
            --brand: #1d1d1f;
            --brand-deep: #000000;
            --line: #d2d2d7;
            --panel: #ffffff;
            --warn-bg: #fff8e1;
            --warn-border: #f6c65b;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
            padding-bottom: 108px;
        }

        .wrap {
            width: min(1160px, calc(100vw - 24px));
            margin: 22px auto 48px;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            padding: 7px 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 2px;
            background: var(--brand);
        }

        .top-link {
            text-decoration: none;
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
        }

        h1 {
            margin: 0;
            font-size: clamp(42px, 7vw, 88px);
            line-height: 0.95;
            letter-spacing: -0.02em;
        }

        .sub {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.45;
        }

        .desc {
            margin-top: 14px;
            max-width: 760px;
            color: #3a3a3c;
            font-size: 14px;
            line-height: 1.75;
        }

        .desc p {
            margin: 0;
        }

        .desc p+p {
            margin-top: 8px;
        }

        .desc-lead {
            color: #2c2c2e;
            font-weight: 600;
            line-height: 1.7;
        }

        .desc-grid {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .desc-item {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 12px;
        }

        .desc-item h2 {
            margin: 0;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #636366;
            text-transform: uppercase;
        }

        .desc-item p {
            margin-top: 6px;
            color: #3a3a3c;
            font-size: 13px;
            line-height: 1.65;
        }

        .notice {
            margin-top: 14px;
            border: 1px solid var(--warn-border);
            background: var(--warn-bg);
            color: #8a5a02;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.7;
            display: none;
        }

        .notice.show {
            display: block;
        }

        .shots {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .shot {
            border: 1px solid var(--line);
            border-radius: 20px;
            aspect-ratio: 4 / 3;
            background: #000;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 0;
            background: #111;
        }

        .shot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 0;
            background: #111;
            position: relative;
            z-index: 1;
        }

        .shot-placeholder {
            color: #78716c;
            font-size: 13px;
            text-align: center;
            line-height: 1.7;
            padding: 12px;
        }

        .download {
            position: fixed;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            z-index: 30;
            width: min(560px, calc(100vw - 20px));
            border: none;
            border-radius: 0;
            background: transparent;
            backdrop-filter: none;
            box-shadow: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }

        .btn {
            text-decoration: none;
            border-radius: 999px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            min-height: 52px;
            width: 100%;
        }

        .btn-primary {
            color: #fff;
            background: linear-gradient(180deg, #1f1f21 0%, #000 100%);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24);
        }

        .btn:disabled,
        .btn.disabled {
            opacity: 0.55;
            pointer-events: none;
            cursor: default;
        }

        .status {
            margin-top: 10px;
            text-align: center;
            color: #44403c;
            font-size: 12px;
            line-height: 1.7;
            min-height: 22px;
        }

        .shots-tip {
            margin-top: 8px;
            color: #8b8b90;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 1100px) {
            .shots {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 1200px) {
            .wrap {
                width: min(1120px, calc(100vw - 20px));
            }
        }

        @media (max-width: 840px) {
            .shots {
                grid-template-columns: 1fr;
            }

            .shot {
                aspect-ratio: 4 / 3;
            }

            .sub {
                font-size: 15px;
            }

            .desc {
                font-size: 13px;
                line-height: 1.72;
            }

            .desc-grid {
                grid-template-columns: 1fr;
            }

            .desc-item p {
                font-size: 12px;
            }

            .download {
                width: calc(100vw - 16px);
                bottom: 8px;
            }
        }
    </style>
</head>

<body>
    <main class="wrap">
        <div class="top">
            <span class="badge"><span class="dot"></span> HI KIKI · DOWNLOAD</span>
            <a class="top-link" href="../index.html">返回产品页</a>
        </div>

        <h1>Hi Kiki</h1>
        <p class="sub">好玩、直接、立即开始。</p>
        <div class="desc">
            <p class="desc-lead">Hi Kiki 是面向儿童启蒙阶段的互动学习应用，帮助孩子在轻松体验中建立词汇与表达能力。</p>
            <div class="desc-grid">
                <article class="desc-item">
                    <h2>Learning Method</h2>
                    <p>通过真实生活场景与即时反馈，让孩子在互动中更自然地理解内容并形成表达。</p>
                </article>
                <article class="desc-item">
                    <h2>Learning Outcome</h2>
                    <p>围绕图像认知、语音朗读与练习互动等核心环节，采用循序渐进节奏，帮助孩子更容易理解、记住并表达。</p>
                </article>
            </div>
        </div>

        <div id="wechatNotice" class="notice">当前在微信内访问，部分机型可能限制下载。若下载未开始，请点击右上角并选择“在浏览器打开”。</div>

        <section class="shots" id="shots"></section>
        <div class="shots-tip">应用示意图</div>

        <section class="download">
            <div class="actions">
                <a id="smartBtn" class="btn btn-primary" href="#">下载 Hi Kiki</a>
            </div>

            <div class="status" id="statusText"></div>
        </section>
    </main>

    <script>
        // ====== 你只需要改这里 ======
        const ANDROID_APK_URL = 'https://img.keepthinking.me/download/hikiki/hikiki_app.apk';
        const IOS_TESTFLIGHT_URL = '';
        const SCREENSHOTS = [
            './img/Screenshot_2026-05-31-16-23-31-162_com.just.kiki.jpg',
            './img/Screenshot_2026-05-31-16-23-37-967_com.just.kiki.jpg',
            './img/Screenshot_2026-05-31-16-24-34-163_com.just.kiki.jpg'
        ];
        // ===========================

        const ua = navigator.userAgent || '';
        const isAndroid = /Android/i.test(ua);
        const isIOS = /iPhone|iPad|iPod/i.test(ua);
        const isWeChat = /MicroMessenger/i.test(ua);

        const smartBtn = document.getElementById('smartBtn');
        const statusText = document.getElementById('statusText');
        const shots = document.getElementById('shots');
        const wechatNotice = document.getElementById('wechatNotice');

        if (isWeChat) {
            wechatNotice.classList.add('show');
        }

        const renderShot = (src, idx) => {
            const item = document.createElement('div');
            item.className = 'shot';
            if (src && src.trim()) {
                const img = document.createElement('img');
                img.src = src;
                img.alt = `Hi Kiki showcase ${idx + 1}`;
                item.appendChild(img);
            } else {
                const ph = document.createElement('div');
                ph.className = 'shot-placeholder';
                ph.innerHTML = `展示图 ${idx + 1}<br/>替换 SCREENSHOTS[${idx}]`;
                item.appendChild(ph);
            }
            return item;
        };

        SCREENSHOTS.forEach((src, idx) => {
            shots.appendChild(renderShot(src, idx));
        });

        const setStatus = (msg) => {
            statusText.textContent = msg || '';
        };

        const go = (url) => {
            window.location.href = url;
        };

        const setSmartButton = () => {
            let target = '';

            if (isAndroid) {
                smartBtn.textContent = '下载 Hi Kiki';
                target = ANDROID_APK_URL && ANDROID_APK_URL.trim() ? ANDROID_APK_URL : '';
            } else if (isIOS) {
                smartBtn.textContent = IOS_TESTFLIGHT_URL ? '下载 Hi Kiki' : 'Hi Kiki 即将上线';
                target = IOS_TESTFLIGHT_URL && IOS_TESTFLIGHT_URL.trim() ? IOS_TESTFLIGHT_URL : '';
            } else {
                smartBtn.textContent = '下载 Hi Kiki';
                if (ANDROID_APK_URL && ANDROID_APK_URL.trim()) {
                    target = ANDROID_APK_URL;
                } else if (IOS_TESTFLIGHT_URL && IOS_TESTFLIGHT_URL.trim()) {
                    target = IOS_TESTFLIGHT_URL;
                }
            }

            if (target) {
                smartBtn.href = target;
            } else {
                smartBtn.href = '#';
            }
        };

        smartBtn.addEventListener('click', (e) => {
            if (!smartBtn.href || smartBtn.getAttribute('href') === '#') {
                e.preventDefault();
                setStatus('下载通道暂未配置，请联系支持邮箱获取安装方式。');
            }
        });

        setSmartButton();
    </script>
</body>

</html>
